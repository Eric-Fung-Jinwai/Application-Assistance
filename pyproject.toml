[project]
name = "career-assistant"
version = "0.1.0"
description = "Evidence-Aware Career Application Assistant"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "chromadb>=0.5",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "streamlit>=1.33",
    "playwright>=1.44",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "jinja2>=3.1",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["career_assistant"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
